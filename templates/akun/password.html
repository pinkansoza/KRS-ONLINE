{{define "content"}}
<div class="kartu">
  <h2>Ganti password</h2>
  <form method="post" action="/akun/password">
    {{template "csrf" .}}
    <div class="form-group">
      <label for="lama">Password lama</label>
      <input type="password" id="lama" name="lama" required>
      {{with index .Errors "lama"}}<span class="err">{{.}}</span>{{end}}
    </div>
    <div class="form-group">
      <label for="baru">Password baru</label>
      <input type="password" id="baru" name="baru" minlength="8" maxlength="72" required>
      {{with index .Errors "baru"}}<span class="err">{{.}}</span>{{end}}
    </div>
    <div class="form-group">
      <label for="ulang">Ulangi password baru</label>
      <input type="password" id="ulang" name="ulang" minlength="8" maxlength="72" required>
      {{with index .Errors "ulang"}}<span class="err">{{.}}</span>{{end}}
    </div>
    <div class="form-actions"><button class="btn" type="submit">Simpan</button></div>
    <p class="redup kecil">Setelah berhasil, semua sesi login Anda akan dikeluarkan.</p>
  </form>
</div>
{{end}}
